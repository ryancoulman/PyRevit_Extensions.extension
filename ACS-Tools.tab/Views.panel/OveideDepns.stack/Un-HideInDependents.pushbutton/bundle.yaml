title:
  en_us: Un-hide in Dependents
tooltip:
  en_us: |-
    **Overview:**
    Un-hide selected elements in the active master view and all its dependent views simultaneously. This tool is useful for maintaining a clean and focused view across multiple related views.
    
    **Instructions:**
    Select the elements you wish to un-hide in the active master view. Then click this button to un-hide those elements in the active view and all dependent views.

